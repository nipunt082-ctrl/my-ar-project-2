<!DOCTYPE html>
<html>
    <head>
        <title>AR Project - Full Reset</title>
        <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    </head>
    <body style="margin: 0px; overflow: hidden;">
        <a-scene embedded arjs='sourceType: webcam; debugUIEnabled: true;'>
            
            <a-assets>
                <a-asset-item id="cad-model" src="my_model.glb" 
                    onerror="alert('Error: Model file not found. Check your GitHub filenames!')">
                </a-asset-item>
            </a-assets>

            <a-marker preset="hiro">
                <a-box position='0 0.5 0' material='color: blue; opacity: 0.7;' scale="0.3 0.3 0.3"></a-box>

                <a-entity 
                    gltf-model="#cad-model" 
                    scale="0.01 0.01 0.01" 
                    position="0 0 0" 
                    rotation="-90 0 0">
                </a-entity>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
