<!DOCTYPE html>
<html>
    <head>
        <title>FOE USJP AR Project</title>
        <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    </head>

    <body style="margin: 0px; overflow: hidden;">
        <a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false;' renderer="colorManagement: true;">
            
            <a-assets>
                <a-asset-item id="cad-model" src="my_model.glb"></a-asset-item>
            </a-assets>

            <a-marker type="pattern" url="AR_Marker.patt">
                
                <a-entity 
                    gltf-model="#cad-model" 
                    scale="0.3 0.3 0.3" 
                    position="0 0 0" 
                    rotation="0 0 0"
                    animation-mixer="clip: Animation; loop: repeat; timeScale: 1;">
                </a-entity>

            </a-marker>

            <a-entity light="type: ambient; intensity: 2.5; color: #FFF"></a-entity>
            <a-entity light="type: directional; intensity: 1.2" position="1 1 1"></a-entity>

            <a-entity camera></a-entity>
            
        </a-scene>
    </body>
</html>
