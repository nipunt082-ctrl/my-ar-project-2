<!DOCTYPE html>
<html>
    <head>
        <title>Engineering AR CAD Viewer - Animated</title>
        <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/donmccready/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    </head>

    <body style="margin: 0px; overflow: hidden;">
        <a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false;'>
            
            <a-assets>
                <a-asset-item id="cad-model" src="my_model.glb"></a-asset-item>
            </a-assets>

            <a-marker preset="hiro">
                
                <a-entity 
                    gltf-model="#cad-model" 
                    scale="1 1 1" 
                    position="0 0 0" 
                    rotation="-90 0 0"
                    animation-mixer>
                </a-entity>

            </a-marker>

            <a-entity camera></a-entity>
            
        </a-scene>
    </body>
</html>
